services:

  backend: 
    image: lolaedoc/app:backend

    env_file:
      - ./backend/.env

    environment:
      - name=value

    volumes: 
      - /app/node_modules
    
    ports: 
      - "127.0.0.1:3000:3000"
    
  frontend:

    image: lolaedoc/app:frontend

    ports:
      - "127.0.0.1:4200:4200"

    volumes:
      - /app/node_modules

    command: npm start -- --host 0.0.0.0 --port 4200 

