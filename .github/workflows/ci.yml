name: Test Runner

on:
  branches: ["dev"]
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Informations système
        run: |
          echo "Runner : $RUNNER_NAME"
          echo "OS : $RUNNER_OS"
          echo "Architecture : $RUNNER_ARCH"
          hostname
          uname -a

      - name: Test
        run: |
          echo "Le runner fonctionne correctement !"
          echo "Hello depuis le runner 🚀"