services:

  backend:
    container_name: backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    volumes:
      - ./backend/src:/app/src
      - /app/node_modules


  frontend:
    container_name: frontend

    build:
      context: ./frontend
      target: builder

    volumes:
      - ./frontend:/app
      - /app/node_modules